[project]
name = "sanmai"
version = "0.0.0"
description = "SanMai AI — the AI-native, self-hostable restaurant OS (core engine)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "python-multipart>=0.0.9",
    "google-generativeai>=0.8",
    "firebase-admin>=6.5",
    "google-cloud-storage>=2.16",
    "google-api-python-client>=2.0",
    "google-auth>=2.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.9",
    "ruff>=0.4",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "respx>=0.21",
]

[project.scripts]
sanmai = "cli.sanmai.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["be", "cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
